spring.application.name=Shree_Electronics
server.port=8080

# Configure these values in your environment. Never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/electronics_shop}
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=
spring.jpa.show-sql=
spring.jpa.open-in-view=

# Optional email configuration. Leave MAIL_* unset to disable email sending.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=
spring.mail.properties.mail.smtp.starttls.enable=
spring.mail.test-connection=

# Admin Basic Auth credentials (change before running outside localhost)
app.admin.username=
app.admin.password=
app.sms.api-key=
